<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}</style>
<title>Smuggler's Paradise Club</title>
<meta name="description" content="Smuggler's Paradise. Members only.">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#050404">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Smuggler's Paradise">
<meta property="og:title" content="Smuggler's Paradise Club">
<meta property="og:description" content="Members only. Pay the Price to Play in Paradise.">
<meta property="og:url" content="https://smugglersparadise.club/">
<meta property="og:image" content="https://smugglersparadise.club/og-image.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Smugpara eagle crest">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://smugglersparadise.club/og-image.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;500&family=Pirata+One&display=swap">
<style>
  /* Layout: tall centred column with deliberate black space; footer: socials centred, request access bottom-left, terms bottom-right (stacked centre on phones). */
  :root {
    --ink: #050404;          /* page black */
    --panel: #0e0b0a;        /* code bar ground */
    --red: #c3161f;          /* primary red: name, button, links */
    --red-hi: #e0262f;
    --coral: #f2554d;        /* coral red: error, tagline */
    --brown: #8a5a3e;        /* terms link, quiet text */
    --white: #f4efe7;        /* warm off-white for "Members Only" */
    --bone: #d9d1c4;         /* body copy */
    --line: #2a1d18;
    --pirate: "Pirata One", "UnifrakturCook", "Old English Text MT", Georgia, serif;
    --bebas: "Bebas Neue", "Oswald", Impact, "Arial Narrow", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
    /* type scale, ratio ~1.333 */
    --s-1: .75rem; --s0: 1rem; --s1: 1.333rem; --s2: 1.777rem; --s3: 2.369rem; --s4: 3.157rem;
    /* one "finger space": the spacing unit the whole column is built on */
    --u: clamp(10px, 1.6vh, 18px);
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    background: var(--ink);
    color: var(--bone);
    font-family: var(--mono);
    font-size: 15px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  ::selection { background: var(--red); color: var(--ink); }

  .page {
    min-height: 100%;
    display: grid;
    min-height: 100dvh;
    box-sizing: border-box;
    grid-template-rows: auto 1fr auto;   /* top: logos · middle: sign-in · bottom: footer */
    align-items: center;
    padding-left: max(20px, env(safe-area-inset-left, 0px));
    padding-right: max(20px, env(safe-area-inset-right, 0px));
  }
  main {
    justify-self: center;
    width: 100%;
    max-width: 34rem;
    padding-block: calc(var(--u) * 5);
    display: flex; flex-direction: column; align-items: center;
    text-align: center;
  }

  /* Top band: skull emblem dead centre on the page axis (same axis as "Members Only");
     the other four marks fan out evenly on each side, sized by area so they read as one group. */
  .marks {
    --W: min(1080px, calc(100vw - 40px));
    --L: calc(var(--W) / 10);
    align-self: start;
    justify-self: center;
    width: var(--W);
    padding-top: calc(var(--u) * 2.5);
    display: grid;
    grid-template-columns: 1fr calc(var(--L) * 2.2) 1fr;
    align-items: center;
  }
  .marks .side { display: flex; align-items: center; justify-content: space-evenly; }
  .marks img { display: block; width: 100%; height: auto; }
  .m-script { width: calc(var(--L) * 2.31) !important; }
  .m-sp     { width: calc(var(--L) * 1)    !important; }
  .m-eagle  { width: calc(var(--L) * 1.14) !important; }
  .m-world  { width: calc(var(--L) * 1.41) !important; }
  .logo-btn { all: unset; cursor: pointer; display: block; }
  .logo { transition: transform .25s ease, filter .25s ease; }
  .logo-btn:hover .logo { transform: scale(1.02); }
  .logo-btn[aria-pressed="true"] .logo { transition: none; transform: scale(var(--pulse, 1)); filter: drop-shadow(0 0 calc(var(--glow, 0) * 28px) rgba(242, 85, 77, .55)); }
  .logo-btn.fallback[aria-pressed="true"] .logo { animation: beat .6s ease-in-out infinite; }
  @keyframes beat { 50% { transform: scale(1.025); } }

  .members {
    margin: 0;
    font-family: var(--bebas);
    -webkit-text-stroke: .4px currentColor;
    paint-order: stroke fill;
    font-size: .9rem;
    line-height: 1;
    letter-spacing: .32em;
    padding-left: .32em;           /* balances trailing letter-spacing so it centres optically */
    color: var(--white);
    display: inline-block;
  }

  form { margin-top: calc(var(--u) * 1); display: flex; flex-direction: column; align-items: center; gap: calc(var(--u) * 1); width: 100%; }
  form .error { margin-top: calc(var(--u) * 1); }
  .down { margin: 0; color: var(--brown); font-size: var(--s-1); letter-spacing: .04em; }
  .bar {
    width: 18rem;
    max-width: 100%;
    box-sizing: border-box;
    background: var(--panel);
    border: 1px solid rgba(242, 85, 77, .6);   /* very thin coral line */
    padding: .4em 1.5em;
    text-align: left;
    transition: border-color .2s;
    animation: glint 3s ease-in-out infinite;
  }
  /* every 3 seconds the line lights up slightly, then settles */
  @keyframes glint {
    0%, 70%, 100% { border-color: rgba(242, 85, 77, .6); box-shadow: 0 0 0 rgba(242, 85, 77, 0); }
    82% { border-color: rgba(242, 85, 77, 1); box-shadow: 0 0 10px rgba(242, 85, 77, .35), inset 0 0 6px rgba(242, 85, 77, .12); }
  }
  .bar:focus-within, .bar.err { border-color: var(--coral); }
  .bar.shake { animation: shake .42s cubic-bezier(.36,.07,.19,.97), glint 3s ease-in-out infinite; }
  @keyframes shake {
    10%, 90% { transform: translateX(-2px); }
    20%, 80% { transform: translateX(4px); }
    30%, 50%, 70% { transform: translateX(-8px); }
    40%, 60% { transform: translateX(8px); }
  }
  input {
    all: unset;
    box-sizing: border-box;
    display: block;
    width: 100%;
    font-family: var(--mono);
    font-size: var(--s0);
    color: var(--white);
    letter-spacing: .02em;
    line-height: 1.6;
    caret-color: var(--red);
    text-align: left;
  }
  input::placeholder { color: var(--brown); opacity: 1; letter-spacing: -.03em; word-spacing: -.15em; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  button.enter {
    font: inherit; font-weight: 500;
    font-size: var(--s-1); letter-spacing: .24em; text-transform: uppercase;
    padding: .85rem 1.6rem .85rem calc(1.6rem + .24em);
    color: var(--ink); background: var(--red);
    border: 0; cursor: pointer;
    transition: background .15s;
  }
  button.enter:hover { background: var(--red-hi); }
  button.enter:disabled { opacity: .6; cursor: progress; }
  :focus-visible { outline: 1px solid var(--white); outline-offset: 3px; }
  input:focus-visible { outline: none; }

  .error {
    margin: 0;
    font-family: var(--bebas);
    font-size: var(--s1);
    letter-spacing: .08em;
    line-height: 1.2;
  }
  .error a { color: var(--coral); border-bottom: 1px solid currentColor; }
  .error:not([hidden]) { animation: pop .3s cubic-bezier(.2,.8,.2,1.2) both; }
  @keyframes pop { from { opacity: 0; transform: translateY(-6px) scale(.96); } }

  /* Tagline: letters catch from the centre outward, like heat spreading through them. */
  .tagline {
    margin: calc(var(--u) * 1.5) 0 0;
    font-family: var(--pirate);
    font-weight: 400;
    font-size: clamp(var(--s1), 5vw, var(--s2) * 1.1);
    line-height: 1.3;
    color: var(--coral);
    text-wrap: balance;
  }
  .tagline .w { display: inline-block; white-space: nowrap; }
  .tagline .c { display: inline-block; animation: ignite 1.5s ease-out both; animation-delay: calc(.25s + var(--d) * 1ms); }
  @keyframes ignite {
    0%   { color: rgba(40, 8, 6, 0); text-shadow: none; transform: translateY(2px); }
    25%  { color: #3a0906; text-shadow: 0 0 6px rgba(194, 40, 20, .35); }
    50%  { color: #a3180f; text-shadow: 0 0 14px rgba(255, 96, 40, .55), 0 -3px 20px rgba(255, 140, 60, .3); }
    72%  { color: #ff7b52; text-shadow: 0 0 10px rgba(255, 120, 70, .45), 0 -2px 14px rgba(255, 160, 80, .2); transform: none; }
    100% { color: var(--coral); text-shadow: 0 0 0 rgba(242, 85, 77, 0); }
  }

  .legal { margin-top: calc(var(--u) * 1.5); display: grid; grid-template-columns: 1fr 1fr; align-items: baseline; gap: .75rem 2rem; font-size: var(--s-1); letter-spacing: .14em; text-transform: uppercase; }
  a { color: var(--red); text-decoration: none; border-bottom: 1px solid transparent; transition: border-color .15s, color .15s; }
  a:hover { border-bottom-color: currentColor; }
  a.quiet { color: var(--brown); }

  .req > button {
    all: unset; cursor: pointer;
    color: var(--red); border-bottom: 1px solid transparent; transition: border-color .15s;
  }
  .req > button:hover, .req > button[aria-expanded="true"] { border-bottom-color: currentColor; }
  .bubble {
    position: relative;
    margin-top: 1.1rem;
    width: min(20rem, 100%);
    letter-spacing: .01em;
    box-sizing: border-box;
    background: var(--panel);
    border: 1px solid var(--red);
    padding: 1rem 1.15rem;
    color: var(--bone);
    font-size: .82rem; letter-spacing: .01em; text-transform: none; line-height: 1.55;
    text-align: left;
    z-index: 5;
  }
  .bubble::before {
    content: ""; position: absolute; top: -7px; left: var(--caret-x, 50%);
    width: 12px; height: 12px; background: var(--panel);
    border-left: 1px solid var(--red); border-top: 1px solid var(--red);
    transform: translateX(-50%) rotate(45deg);
  }
  .bubble:not([hidden]) { animation: bub .22s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes bub { from { opacity: 0; transform: translateY(-6px); } }
  .bubble strong { color: var(--white); font-weight: 500; }
  .bubble p { margin: 0; }
  .bubble p + p { margin-top: .6rem; }

  footer {
    margin-top: calc(var(--u) * 8);
    padding-block: 0 calc(var(--u) * 2);
    align-self: end;
    display: flex; flex-direction: column;
  }
  .socials {
    display: flex; justify-content: center; flex-wrap: wrap;
    gap: .5rem 2rem;
    font-size: var(--s-1); letter-spacing: .2em; text-transform: uppercase;
  }
  .legal .req { justify-self: start; }
  .legal #terms { justify-self: end; }
  .legal .bubble { grid-column: 1; grid-row: 2; justify-self: start; margin-top: 0; }

  /* Entrance: each block falls into place, staggered, under a second. */
  .in { animation: rise .6s cubic-bezier(.2,.7,.2,1) both; animation-delay: var(--i, 0s); }
  @keyframes rise { from { opacity: 0; transform: translateY(12px); } }

  @media (max-width: 480px) {
    .socials { gap: .5rem 1.25rem; }
  }
  @media (max-width: 640px) {
    .legal { grid-template-columns: 1fr; justify-items: center; }
    .legal .req, .legal #terms, .legal .bubble { justify-self: center; }
    .legal .bubble { grid-row: 2; }
    .legal #terms { grid-row: 3; }
  }
  @media (prefers-reduced-motion: reduce) {
    .bar, .bar.shake { animation: none; }
    .in, .tagline .c, .bar.shake, .logo-btn[aria-pressed="true"] .logo, .error:not([hidden]), .bubble:not([hidden]) { animation: none; }
  }
</style>
</head>
<body>

<div class="page">
  <header class="marks in" aria-label="Smuggler's Paradise">
    <div class="side">
      <img class="m-script" src="assets/logo-script.webp" width="600" height="112" alt="Smuggler's script">
      <img class="m-sp" src="assets/logo-sp.webp" width="600" height="593" alt="SP monogram">
    </div>
    <button type="button" class="logo-btn" id="logo-btn" aria-pressed="false" aria-label="Play music" title="Play music">
      <img class="logo" src="assets/logo-skull.webp" width="900" height="700" alt="Smugglers Paradise skull emblem: Faith Rewards the Brave">
    </button>
    <div class="side">
      <img class="m-eagle" src="assets/logo-eagle.webp" width="600" height="458" alt="Smugpara eagle crest">
      <img class="m-world" src="assets/logo-world.webp" width="600" height="303" alt="Smuggler World">
    </div>
  </header>
  <audio id="song" src="assets/city.mp3" preload="none" loop></audio>

  <main>
    <h1 class="sr">Smuggler's Paradise</h1>
    <p class="members in" id="members" style="--i:.16s">Members Only</p>

    <form class="in" id="gate" style="--i:.24s" autocomplete="off" novalidate>
      <div class="bar" id="bar">
        <label for="pw" class="sr">Password</label>
        <input id="pw" name="password" type="password" placeholder="Was de code?" autocomplete="current-password" required>
      </div>
      <button type="submit" class="enter" id="enter">Enter</button>
      <p class="down" id="down" role="status" hidden></p>
      <p class="error" id="error" role="alert" hidden><a href="https://smugpara.com/membership">Become a member to access the site</a></p>
    </form>

    <p class="tagline" id="tagline" aria-label="Pay the Price to Play in Paradise" hidden>Pay the Price to Play in Paradise</p>

  </main>

  <footer class="in" style="--i:.4s">
    <nav class="socials" aria-label="Social media">
      <a href="https://www.instagram.com/smugglerparadise" target="_blank" rel="noopener">Instagram</a>
      <a href="https://www.tiktok.com/@smugglerparadise" target="_blank" rel="noopener">TikTok</a>
      <a href="#x">X</a>
      <a href="https://www.facebook.com/share/1KfffKuDbd/" target="_blank" rel="noopener">Facebook</a>
    </nav>
    <div class="legal">
      <span class="req">
        <button type="button" id="req-btn" aria-expanded="false" aria-controls="req-bubble">Request access</button>
      </span>
      <a href="terms.html" class="quiet" id="terms">Terms &amp; conditions</a>
      <div class="bubble" id="req-bubble" role="note" hidden>
        <p><strong>Membership is earned, not asked for.</strong></p>
        <p>Buy any Smug Para product and you'll find a secret code with your order. Enter that code here to get in.</p>
      </div>
    </div>
  </footer>
</div>

<script>
(function () {
  // Tagline: split into letters; delay grows with distance from the centre.
  var tag = document.getElementById('tagline');
  var text = tag.textContent, words = text.split(' '), total = text.length, mid = (total - 1) / 2, pos = 0;
  tag.textContent = '';
  words.forEach(function (word, wi) {
    var w = document.createElement('span'); w.className = 'w'; w.setAttribute('aria-hidden', 'true');
    for (var k = 0; k < word.length; k++) {
      var c = document.createElement('span'); c.className = 'c'; c.textContent = word[k];
      var dist = Math.abs(pos - mid) / mid;
      c.style.setProperty('--d', Math.round(dist * 700 + Math.random() * 120));
      w.appendChild(c); pos++;
    }
    tag.appendChild(w);
    if (wi < words.length - 1) { tag.appendChild(document.createTextNode(' ')); pos++; }
  });

  // Code check: the code goes to /api/enter (a Cloudflare Function), which asks Supabase.
  // A good code sets a sign-in cookie and sends the member to /members/. Anything else is a wrong code.
  var form = document.getElementById('gate'), pw = document.getElementById('pw'),
      bar = document.getElementById('bar'), err = document.getElementById('error'),
      enter = document.getElementById('enter'), status = document.getElementById('down');
  function wrongCode() {
    status.hidden = true;
    pw.value = '';
    bar.classList.remove('shake'); void bar.offsetWidth; bar.classList.add('shake', 'err');
    err.hidden = false;
    // Tagline appears only after a wrong code, and re-ignites on each one.
    tag.hidden = false;
    tag.querySelectorAll('.c').forEach(function (c) { c.style.animation = 'none'; });
    void tag.offsetWidth;
    tag.querySelectorAll('.c').forEach(function (c) { c.style.animation = ''; });
    pw.focus();
  }
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var code = pw.value.trim();
    if (!code) { pw.focus(); return; }
    enter.disabled = true;
    fetch('/api/enter', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'same-origin',
      body: JSON.stringify({ code: code })
    }).then(function (r) {
        if (r.ok) return r.json();
        if (r.status === 401) return { ok: false };
        return { ok: false, down: true };          // server or setup problem, not a wrong code
      })
      .catch(function () { return { ok: false, down: true }; })
      .then(function (res) {
        enter.disabled = false;
        if (res && res.ok) { window.location.href = res.redirect || '/members/'; }
        else if (res && res.down) { status.textContent = "Can't check codes right now. Try again in a minute."; status.hidden = false; }
        else { wrongCode(); }
      });
  });
  pw.addEventListener('input', function () { bar.classList.remove('err'); });

  // Logo toggles the song.
  var lb = document.getElementById('logo-btn'), song = document.getElementById('song');
  lb.addEventListener('click', function () {
    if (song.paused) {
      var p = song.play();
      if (p && p.catch) p.catch(function () { setPlaying(false); });
      setPlaying(true);
    } else { song.pause(); setPlaying(false); }
  });
  // Pulse to the beat: read the bass from the song as it plays and scale the crest on each hit.
  var ctx, analyser, bins, raf, env = 0, avg = 0, logo = lb.querySelector('.logo');
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function startBeat() {
    if (reduceMotion) return;
    try {
      if (!ctx) {
        ctx = new (window.AudioContext || window.webkitAudioContext)();
        var src = ctx.createMediaElementSource(song);
        analyser = ctx.createAnalyser();
        analyser.fftSize = 1024; analyser.smoothingTimeConstant = 0.6;
        src.connect(analyser); analyser.connect(ctx.destination);
        bins = new Uint8Array(analyser.frequencyBinCount);
      }
      if (ctx.state === 'suspended') ctx.resume();
      cancelAnimationFrame(raf); tick();
    } catch (e) { lb.classList.add('fallback'); }
  }
  function tick() {
    analyser.getByteFrequencyData(bins);
    // bins 1-5 cover roughly 40-220 Hz: kick and bass
    var bass = (bins[1] + bins[2] + bins[3] + bins[4] + bins[5]) / (5 * 255);
    avg = avg * 0.97 + bass * 0.03;
    var hit = Math.max(0, bass - avg * 1.08) / Math.max(0.08, 1 - avg);
    env = Math.max(hit, env * 0.86);
    var k = Math.min(1, env * 2.2);
    logo.style.setProperty('--pulse', (1 + k * 0.06).toFixed(4));
    logo.style.setProperty('--glow', k.toFixed(3));
    raf = requestAnimationFrame(tick);
  }
  function stopBeat() { cancelAnimationFrame(raf); env = 0; logo.style.setProperty('--pulse', 1); logo.style.setProperty('--glow', 0); }
  song.addEventListener('play', startBeat);
  song.addEventListener('pause', stopBeat);

  function setPlaying(on) {
    lb.setAttribute('aria-pressed', String(on));
    lb.setAttribute('aria-label', on ? 'Pause music' : 'Play music');
    lb.title = on ? 'Pause music' : 'Play music';
  }

  // Request access bubble.
  var rb = document.getElementById('req-btn'), bub = document.getElementById('req-bubble');
  function setBubble(open) {
    bub.hidden = !open; rb.setAttribute('aria-expanded', String(open));
    if (open) {
      var r = rb.getBoundingClientRect(), b = bub.getBoundingClientRect();
      var x = Math.min(Math.max(r.left + r.width / 2 - b.left, 16), b.width - 16);
      bub.style.setProperty('--caret-x', x + 'px');
    }
    if (open && window.matchMedia('(max-width: 640px)').matches) {
      var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      setTimeout(function () { bub.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'center' }); }, 30);
    }
  }
  rb.addEventListener('click', function (e) { e.stopPropagation(); setBubble(bub.hidden); });
  document.addEventListener('click', function (e) { if (!bub.hidden && !bub.contains(e.target)) setBubble(false); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !bub.hidden) { setBubble(false); rb.focus(); } });
})();
</script>
</body>
</html>
