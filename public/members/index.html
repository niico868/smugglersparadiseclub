<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Members · Smuggler's Paradise</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;500&family=Pirata+One&display=swap">
<style>
  /* Placeholder members area: the exclusive features and drops get built here next. */
  :root {
    --ink: #050404; --red: #c3161f; --coral: #f2554d; --brown: #8a5a3e; --white: #f4efe7; --bone: #d9d1c4;
    --u: clamp(10px, 1.6vh, 18px);
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body { margin: 0; background: var(--ink); color: var(--bone); font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace; font-size: 15px; -webkit-font-smoothing: antialiased; }
  .page { min-height: 100dvh; box-sizing: border-box; display: grid; place-items: center; text-align: center; padding: calc(var(--u) * 3) max(20px, env(safe-area-inset-right, 0px)) calc(var(--u) * 3) max(20px, env(safe-area-inset-left, 0px)); }
  main { display: flex; flex-direction: column; align-items: center; gap: calc(var(--u) * 2); }
  img { width: min(220px, 50vw); height: auto; }
  h1 { margin: 0; font-family: "Pirata One", "Old English Text MT", Georgia, serif; font-weight: 400; color: var(--coral); font-size: clamp(2rem, 7vw, 3rem); }
  p { margin: 0; font-family: "Bebas Neue", Impact, sans-serif; letter-spacing: .3em; padding-left: .3em; color: var(--white); font-size: .9rem; }
  a { color: var(--brown); text-decoration: none; font-size: .75rem; letter-spacing: .2em; text-transform: uppercase; border-bottom: 1px solid transparent; }
  a:hover { border-bottom-color: currentColor; }
  a:focus-visible { outline: 1px solid var(--white); outline-offset: 3px; }
</style>
</head>
<body>
<div class="page">
  <main>
    <img src="/assets/logo-skull.webp" width="900" height="700" alt="Smugglers Paradise skull emblem">
    <h1>Welcome to Paradise</h1>
    <p>Drops land here soon</p>
    <a href="/api/leave">Sign out</a>
  </main>
</div>
</body>
</html>
